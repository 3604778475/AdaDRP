# MMPA-DRP Configuration Template (Phase 1)
# =========================================
# This file is a placeholder for MMPA-DRP hyper-parameters.
# It does NOT replace the original MACB-DRP train_params.json.
# In Phase 2 we will load this alongside the original config.

mmpa:
  # MolecularProgramEncoder settings
  num_programs: 8           # K: number of molecular programs
  program_dim: 64           # d: dimension of each program token
  encoder_hidden_dims: [512, 256, 128]
  encoder_drop: 0.1

  # DrugMechanismGate settings
  gate_hidden_dim: 128
  gate_drop: 0.1

  # ProgramAlignmentLoss settings
  alignment_temperature: 0.1
  alignment_weight: 1.0

  # ProgramContrastiveLoss settings
  contrastive_temperature: 0.1
  contrastive_weight: 0.1

  # Training schedule (to be integrated in train_mmpa.py in Phase 2)
  train_num_epochs: 100
  contrastive_num_epochs: 200
  lr: 0.0001
  batch_size: 64
